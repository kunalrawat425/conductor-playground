# Hourly buyer reminders (unpaid orders, abandoned carts). Vercel Hobby crons are daily-only,
# so GitHub Actions calls the endpoint. Needs repo secret CRON_SECRET (same value as in Vercel).
name: remind-buyers
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call reminder endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET secret not set; skipping"; exit 0; fi
          curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" https://www.relifish.store/api/cron/remind-buyers
